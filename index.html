<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bor u Tachova</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css"><style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial;background:#0d1714}#map{position:fixed;inset:0}.sky-bg{position:fixed;z-index:3;inset:0 0 auto;height:38vh;pointer-events:none;background-size:cover;background-position:center 44%;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent);transition:opacity 5s ease,filter 5s ease}.comic-sun{display:none;position:fixed;z-index:2;right:9vw;top:8vh;width:150px;height:150px;border-radius:50%;background:#ffd51f;border:7px solid #151515;box-shadow:0 0 0 12px #ffed75,0 0 55px 28px #ffd51f99;pointer-events:none;opacity:0;transform:scale(.72) rotate(-8deg);transition:opacity 5s ease,transform 5s ease}.comic-sun:before{content:"☀";position:absolute;inset:-48px;display:grid;place-items:center;font-size:235px;line-height:1;color:#ffd51f;text-shadow:4px 4px 0 #151515;z-index:-1}.comic-sun:after{content:"SHINE!";position:absolute;left:-34px;bottom:-42px;background:#fff;border:4px solid #111;padding:7px 12px;font:900 17px Arial;transform:rotate(-8deg);box-shadow:5px 5px 0 #ff4b4b}.mode-comic .comic-sun{display:block}.mode-comic.comic-sunny .comic-sun{opacity:1;transform:scale(1) rotate(0)}.mode-comic.comic-sunny .sky-bg{opacity:.08;filter:brightness(1.35) saturate(1.15)}.mode-comic.comic-sunny .maplibregl-canvas{filter:saturate(1.7) contrast(1.12) brightness(1.16)}.top-ui{position:fixed;z-index:40;top:16px;left:50%;transform:translateX(-50%);text-align:center}.top-note,.mode-switch{background:#080d0cdd;color:white;padding:9px 16px;border-radius:18px;margin-bottom:8px}.mode-switch{display:flex;padding:4px}.mode-btn{border:0;border-radius:14px;padding:11px 20px;color:#ddd;background:transparent;font-weight:800;cursor:pointer}.mode-btn.active{background:#fff;color:#111}.mode-btn[data-mode=comic].active{background:#ffd738}.mode-btn[data-mode=cyberpunk].active{background:linear-gradient(135deg,#00d9ff,#d900ff);color:#fff}.mode-comic .maplibregl-canvas{filter:saturate(1.45) contrast(1.18);transition:filter 5s ease}.mode-cyberpunk .maplibregl-canvas{filter:brightness(.6) contrast(1.55) saturate(2.3) hue-rotate(165deg)}.mode-cyberpunk .sky-bg{filter:brightness(.55) contrast(1.5) saturate(1.7) hue-rotate(155deg)}.cyber-hen{display:none;position:fixed;z-index:31;left:15%;top:72%;width:145px;pointer-events:none;transition:left 5s linear,top 5s linear;filter:drop-shadow(0 0 7px #00eaff) drop-shadow(0 0 13px #ff00d4)}.mode-cyberpunk .cyber-hen{display:block}.cyber-hen img{width:100%;animation:bob .24s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px) rotate(1deg)}}.egg{position:fixed;z-index:30;width:24px;height:31px;border-radius:50% 50% 45% 45%;background:#fff4d1;border:2px solid #ffefb0;box-shadow:0 0 8px #fff,0 0 14px #ff00d4;transform:translate(-50%,-50%);pointer-events:none}.egg-label{position:absolute;left:50%;top:36px;transform:translateX(-50%);white-space:nowrap;color:#fff;font-size:10px;line-height:1.35;text-align:center;background:#000d;padding:4px 7px;border:1px solid #00eaff;border-radius:8px;text-shadow:0 0 4px #ff00d4}.mode-normal .egg,.mode-comic .egg{display:none}.comic-animal{display:none;position:fixed;z-index:32;left:12%;top:70%;font-size:76px;line-height:1;pointer-events:none;transition:left 4.5s linear,top 4.5s linear;filter:drop-shadow(3px 4px 0 #111)}.mode-comic .comic-animal{display:block}.comic-animal .sprite{display:block;animation:comicHop .34s ease-in-out infinite alternate}.comic-animal .bubble{position:absolute;left:64px;top:-34px;background:#fff;border:4px solid #111;border-radius:50%;padding:8px 11px;font:900 14px/1 Arial;color:#111;box-shadow:4px 4px 0 #ffd738;transform:rotate(-7deg);white-space:nowrap}.comic-animal .bubble:after{content:"";position:absolute;left:12px;bottom:-12px;border:8px solid transparent;border-top-color:#111;transform:rotate(20deg)}@keyframes comicHop{to{transform:translateY(-8px) rotate(-3deg)}}@media(max-width:620px){.mode-btn{padding:9px 8px;font-size:10px}.cyber-hen{width:105px}.egg-label{font-size:8px}.comic-animal{font-size:56px}.comic-animal .bubble{left:45px;top:-28px;font-size:11px}.comic-sun{width:95px;height:95px;right:7vw;top:15vh}.comic-sun:before{font-size:155px;inset:-35px}}
</style></head><body class="mode-normal"><div id="map"></div><div id="sky-bg" class="sky-bg"></div><div class="comic-sun" aria-hidden="true"></div><div class="cyber-hen"><img src="./assets/hen-photo.webp?v=1" alt=""></div><div class="comic-animal" id="comic-cat" data-sound="cat" aria-hidden="true"><span class="sprite">🐈</span><span class="bubble">MŇAU!</span></div><div class="comic-animal" id="comic-dog" data-sound="dog" aria-hidden="true"><span class="sprite">🐕</span><span class="bubble">HAF!</span></div><div class="top-ui"><div class="top-note">Projekt se připravuje · MAKO development</div><div class="mode-switch"><button class="mode-btn active" data-mode="normal">NORMAL</button><button class="mode-btn" data-mode="comic">COMIC</button><button class="mode-btn" data-mode="cyberpunk">CYBERPUNK</button></div></div><script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.mjs';
const sky=document.getElementById('sky-bg');fetch('./assets/sky-clouds-photo.webp.b64').then(r=>r.text()).then(t=>{sky.style.backgroundImage=`url(data:image/webp;base64,${t.trim()})`}).catch(()=>{});
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:[12.7752,49.7117],zoom:14.55,pitch:58,bearing:-14,antialias:true});map.addControl(new maplibregl.NavigationControl(),'top-right');
let mode='normal',started=false,comicStarted=false,audioCtx=null,soundTimer=null,weatherTimer=null;const hen=document.querySelector('.cyber-hen');
function wander(){if(mode!=='cyberpunk'){setTimeout(wander,1500);return}const x=5+Math.random()*82,y=38+Math.random()*50;hen.style.left=x+'%';hen.style.top=y+'%';hen.style.transform=Math.random()>.5?'scaleX(1)':'scaleX(-1)';setTimeout(wander,4800+Math.random()*3500)}
function comicWander(animal,delay=0){setTimeout(function step(){if(mode==='comic'){const x=4+Math.random()*88,y=35+Math.random()*53;animal.style.left=x+'%';animal.style.top=y+'%';const dir=Math.random()>.5?1:-1;animal.querySelector('.sprite').style.transform=`scaleX(${dir})`}setTimeout(step,3800+Math.random()*3200)},delay)}
function initAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(type,startFreq,endFreq,duration,volume,startDelay=0){if(!audioCtx)return;const now=audioCtx.currentTime+startDelay,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(startFreq,now);osc.frequency.exponentialRampToValueAtTime(Math.max(30,endFreq),now+duration);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+.03);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.03)}
function playAnimalSound(kind){if(mode!=='comic')return;initAudio();switch(kind){case 'cat':tone('triangle',720,420,.42,.12);tone('sine',930,520,.32,.07,.08);break;case 'dog':tone('square',190,110,.15,.1);tone('square',170,95,.18,.09,.22);break;case 'elephant':tone('sawtooth',150,65,.8,.11);tone('sine',280,120,.65,.06,.1);break;case 'duck':tone('square',420,250,.12,.08);tone('square',390,230,.12,.07,.16);break;case 'cow':tone('sawtooth',180,95,.7,.08);break;case 'sheep':tone('triangle',390,260,.3,.08);tone('triangle',430,290,.25,.06,.24);break;case 'horse':tone('sawtooth',260,150,.22,.07);tone('triangle',330,180,.18,.05,.2);break;case 'lion':tone('sawtooth',110,55,.9,.11);tone('square',80,45,.65,.05,.12);break;case 'monkey':tone('sine',620,850,.16,.08);tone('sine',760,520,.18,.07,.18);break;default:tone('triangle',440,300,.25,.05)}}
function scheduleAnimalSound(){clearTimeout(soundTimer);if(mode!=='comic')return;soundTimer=setTimeout(()=>{const animals=[...document.querySelectorAll('.comic-animal[data-sound]')];if(animals.length){const animal=animals[Math.floor(Math.random()*animals.length)];playAnimalSound(animal.dataset.sound)}scheduleAnimalSound()},7000+Math.random()*9000)}
function scheduleComicWeather(first=false){clearTimeout(weatherTimer);if(mode!=='comic')return;const wait=first?12000+Math.random()*10000:120000+Math.random()*180000;weatherTimer=setTimeout(()=>{if(mode!=='comic')return;document.body.classList.add('comic-sunny');const sunnyFor=30000+Math.random()*60000;weatherTimer=setTimeout(()=>{document.body.classList.remove('comic-sunny');scheduleComicWeather(false)},sunnyFor)},wait)}
function nearestStreet(lng,lat){try{const p=map.project([lng,lat]),features=map.queryRenderedFeatures([[p.x-28,p.y-28],[p.x+28,p.y+28]]);for(const f of features){const n=f.properties&&(f.properties.name||f.properties['name:cs']);if(n)return n}}catch(e){}return 'Bor u Tachova'}
function layEgg(){if(mode!=='cyberpunk')return;const r=hen.getBoundingClientRect(),cx=r.left+r.width*.5,cy=r.top+r.height*.78;let lng=12.7752,lat=49.7117;try{const ll=map.unproject([cx,cy]);lng=ll.lng;lat=ll.lat}catch(e){}const street=nearestStreet(lng,lat),egg=document.createElement('div');egg.className='egg';egg.style.left=cx+'px';egg.style.top=cy+'px';egg.innerHTML='<span class="egg-label">🥚 '+street+'<br>GPS '+lat.toFixed(6)+', '+lng.toFixed(6)+'</span>';document.body.appendChild(egg)}
function startHen(){if(started)return;started=true;wander();setInterval(layEgg,60000)}
function startComic(){if(!comicStarted){comicStarted=true;[...document.querySelectorAll('.comic-animal')].forEach((animal,i)=>comicWander(animal,i*850))}initAudio();scheduleAnimalSound();scheduleComicWeather(true)}
function apply(n){mode=n;document.body.className='mode-'+n;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===n));if(n==='cyberpunk')startHen();if(n==='comic')startComic();else{clearTimeout(soundTimer);soundTimer=null;clearTimeout(weatherTimer);weatherTimer=null}}
document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.mode)));
</script></body></html>
