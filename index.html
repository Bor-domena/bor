<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1714" />
  <title>Bor u Tachova</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css" />

  <style>
    *{ box-sizing:border-box; }
    html,body{ margin:0; width:100%; height:100%; overflow:hidden; font-family:Arial,Helvetica,sans-serif; background:#0d1714; }
    #map{ position:fixed; inset:0; }

    .top-note{
      position:fixed;
      z-index:5;
      top:18px;
      left:50%;
      transform:translateX(-50%);
      padding:10px 16px;
      border-radius:999px;
      background:rgba(10,18,15,.58);
      border:1px solid rgba(255,255,255,.18);
      color:#fff;
      font-size:13px;
      font-weight:700;
      letter-spacing:.04em;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      text-shadow:0 2px 14px rgba(0,0,0,.45);
      white-space:nowrap;
    }

    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right{ z-index:4; }
  </style>
</head>

<body>
  <div id="map"></div>
  <div class="top-note">Projekt se připravuje · MAKO development</div>

  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.mjs';

    const BOR = [12.7752, 49.7117];

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/bright',
      center: BOR,
      zoom: 12.25,
      pitch: 52,
      bearing: -18,
      canvasContextAttributes: { antialias: true },
      attributionControl: true
    });

    map.addControl(new maplibregl.NavigationControl({
      visualizePitch: true,
      showCompass: true
    }), 'top-right');

    map.on('load', () => {
      const layers = map.getStyle().layers;
      let firstLabelLayer;

      for (const layer of layers) {
        if (layer.type === 'symbol' && layer.layout && layer.layout['text-field']) {
          firstLabelLayer = layer.id;
          break;
        }
      }

      map.addSource('bor-buildings', {
        type: 'vector',
        url: 'https://tiles.openfreemap.org/planet'
      });

      map.addLayer({
        id: 'bor-3d-buildings',
        source: 'bor-buildings',
        'source-layer': 'building',
        type: 'fill-extrusion',
        minzoom: 14,
        filter: ['!=', ['get', 'hide_3d'], true],
        paint: {
          'fill-extrusion-color': [
            'interpolate', ['linear'], ['coalesce', ['get','render_height'], 0],
            0, '#dedbd2',
            20, '#c9c4b7',
            60, '#aaa596'
          ],
          'fill-extrusion-height': [
            'interpolate', ['linear'], ['zoom'],
            14, 0,
            15, ['coalesce', ['get', 'render_height'], 6]
          ],
          'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
          'fill-extrusion-opacity': 0.86
        }
      }, firstLabelLayer);

      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        setTimeout(() => {
          map.flyTo({
            center: BOR,
            zoom: 13.65,
            pitch: 55,
            bearing: -12,
            speed: 0.34,
            curve: 1.25,
            essential: true
          });
        }, 450);
      }
    });

    let raf = null;
    let targetBearing = -12;
    let targetPitch = 55;

    window.addEventListener('mousemove', (e) => {
      if (window.innerWidth < 800 || map.isMoving()) return;

      const nx = (e.clientX / window.innerWidth - 0.5) * 2;
      const ny = (e.clientY / window.innerHeight - 0.5) * 2;
      targetBearing = -12 + nx * 4.5;
      targetPitch = 55 - ny * 2.5;

      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        map.easeTo({
          bearing: targetBearing,
          pitch: targetPitch,
          duration: 650,
          easing: t => t * (2 - t)
        });
      });
    });
  </script>
</body>
</html>
