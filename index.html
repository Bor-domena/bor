<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bor u Tachova</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css"><style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial;background:#0d1714}#map{position:fixed;inset:0}.sky-bg{position:fixed;z-index:3;inset:0 0 auto;height:38vh;pointer-events:none;background-size:cover;background-position:center 44%;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}.top-ui{position:fixed;z-index:40;top:16px;left:50%;transform:translateX(-50%);text-align:center}.top-note,.mode-switch{background:#080d0cdd;color:white;padding:9px 16px;border-radius:18px;margin-bottom:8px}.mode-switch{display:flex;padding:4px}.mode-btn{border:0;border-radius:14px;padding:11px 20px;color:#ddd;background:transparent;font-weight:800;cursor:pointer}.mode-btn.active{background:#fff;color:#111}.mode-btn[data-mode=comic].active{background:#ffd738}.mode-btn[data-mode=cyberpunk].active{background:linear-gradient(135deg,#00d9ff,#d900ff);color:#fff}.mode-comic .maplibregl-canvas{filter:saturate(1.45) contrast(1.18)}.mode-cyberpunk .maplibregl-canvas{filter:brightness(.6) contrast(1.55) saturate(2.3) hue-rotate(165deg)}.mode-cyberpunk .sky-bg{filter:brightness(.55) contrast(1.5) saturate(1.7) hue-rotate(155deg)}.cyber-hen{display:none;position:fixed;z-index:31;left:15%;top:72%;width:145px;pointer-events:none;transition:left 5s linear,top 5s linear;filter:drop-shadow(0 0 7px #00eaff) drop-shadow(0 0 13px #ff00d4)}.mode-cyberpunk .cyber-hen{display:block}.cyber-hen img{width:100%;animation:bob .24s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px) rotate(1deg)}}.egg{position:fixed;z-index:30;width:24px;height:31px;border-radius:50% 50% 45% 45%;background:#fff4d1;border:2px solid #ffefb0;box-shadow:0 0 8px #fff,0 0 14px #ff00d4;transform:translate(-50%,-50%);pointer-events:none}.egg-label{position:absolute;left:50%;top:36px;transform:translateX(-50%);white-space:nowrap;color:#fff;font-size:10px;line-height:1.35;text-align:center;background:#000d;padding:4px 7px;border:1px solid #00eaff;border-radius:8px;text-shadow:0 0 4px #ff00d4}.mode-normal .egg,.mode-comic .egg{display:none}@media(max-width:620px){.mode-btn{padding:9px 8px;font-size:10px}.cyber-hen{width:105px}.egg-label{font-size:8px}}
</style></head><body class="mode-normal"><div id="map"></div><div id="sky-bg" class="sky-bg"></div><div class="cyber-hen"><img src="./assets/hen-photo.webp?v=1" alt=""></div><div class="top-ui"><div class="top-note">Projekt se připravuje · MAKO development</div><div class="mode-switch"><button class="mode-btn active" data-mode="normal">NORMAL</button><button class="mode-btn" data-mode="comic">COMIC</button><button class="mode-btn" data-mode="cyberpunk">CYBERPUNK</button></div></div><script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.mjs';
const sky=document.getElementById('sky-bg');fetch('./assets/sky-clouds-photo.webp.b64').then(r=>r.text()).then(t=>{sky.style.backgroundImage=`url(data:image/webp;base64,${t.trim()})`}).catch(()=>{});
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:[12.7752,49.7117],zoom:14.55,pitch:58,bearing:-14,antialias:true});map.addControl(new maplibregl.NavigationControl(),'top-right');
let mode='normal',started=false;const hen=document.querySelector('.cyber-hen');
function wander(){if(mode!=='cyberpunk'){setTimeout(wander,1500);return}const x=5+Math.random()*82,y=38+Math.random()*50;hen.style.left=x+'%';hen.style.top=y+'%';hen.style.transform=Math.random()>.5?'scaleX(1)':'scaleX(-1)';setTimeout(wander,4800+Math.random()*3500)}
function nearestStreet(lng,lat){try{const p=map.project([lng,lat]),features=map.queryRenderedFeatures([[p.x-28,p.y-28],[p.x+28,p.y+28]]);for(const f of features){const n=f.properties&&(f.properties.name||f.properties['name:cs']);if(n)return n}}catch(e){}return 'Bor u Tachova'}
function layEgg(){if(mode!=='cyberpunk')return;const r=hen.getBoundingClientRect(),cx=r.left+r.width*.5,cy=r.top+r.height*.78;let lng=12.7752,lat=49.7117;try{const ll=map.unproject([cx,cy]);lng=ll.lng;lat=ll.lat}catch(e){}const street=nearestStreet(lng,lat),egg=document.createElement('div');egg.className='egg';egg.style.left=cx+'px';egg.style.top=cy+'px';egg.innerHTML='<span class="egg-label">🥚 '+street+'<br>GPS '+lat.toFixed(6)+', '+lng.toFixed(6)+'</span>';document.body.appendChild(egg)}
function startHen(){if(started)return;started=true;wander();setInterval(layEgg,60000)}
function apply(n){mode=n;document.body.className='mode-'+n;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===n));if(n==='cyberpunk')startHen()}
document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.mode)));
</script></body></html>
