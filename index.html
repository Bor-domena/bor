<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d1714" />
<title>Bor u Tachova</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css" />
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#0d1714}#map{position:fixed;inset:0}.sky-bg{position:fixed;z-index:3;top:0;left:0;right:0;height:38vh;min-height:220px;pointer-events:none;background-size:cover;background-position:center 44%;opacity:.98;-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 62%,rgba(0,0,0,.88) 74%,rgba(0,0,0,.35) 90%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,#000 62%,rgba(0,0,0,.88) 74%,rgba(0,0,0,.35) 90%,transparent 100%)}.top-ui{position:fixed;z-index:20;top:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;width:min(92vw,650px)}.top-note{padding:9px 16px;border-radius:999px;background:rgba(8,13,12,.74);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:700;letter-spacing:.04em;backdrop-filter:blur(12px);white-space:nowrap}.mode-switch{display:grid;grid-template-columns:repeat(3,1fr);width:min(92vw,500px);padding:4px;border-radius:18px;background:rgba(4,8,9,.88);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px)}.mode-btn{border:0;border-radius:14px;padding:11px 14px;color:#ddd;background:transparent;font-weight:800;font-size:12px;letter-spacing:.08em;cursor:pointer}.mode-btn.active{color:#111;background:#fff}.mode-btn[data-mode="comic"].active{background:#ffd738;color:#171100}.mode-btn[data-mode="cyberpunk"].active{color:#fff;background:linear-gradient(135deg,#00d9ff,#d900ff 68%)}.mode-comic .maplibregl-canvas{filter:saturate(1.45) contrast(1.18) brightness(1.03)}.mode-cyberpunk .maplibregl-canvas{filter:brightness(.6) contrast(1.55) saturate(2.3) hue-rotate(165deg)}.mode-comic .sky-bg{filter:saturate(1.45) contrast(1.18)}.mode-cyberpunk .sky-bg{filter:brightness(.55) contrast(1.5) saturate(1.7) hue-rotate(155deg)}
.balloon{position:fixed;z-index:15;left:50%;top:20%;width:clamp(130px,11vw,190px);transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 15px 12px rgba(0,0,0,.35));animation:balloonFlight 32s ease-in-out 4s infinite}.balloon svg{width:100%;height:auto;display:block;animation:balloonBob 3.4s ease-in-out infinite}.mode-comic .balloon{filter:drop-shadow(0 10px 0 rgba(0,0,0,.25)) saturate(1.3) contrast(1.15)}.mode-cyberpunk .balloon{filter:drop-shadow(0 0 18px #ff00d4) saturate(1.8) hue-rotate(35deg)}@keyframes balloonFlight{0%{left:50%;top:20%;transform:translate(-50%,-50%) scale(1)}12%{left:58%;top:15%;transform:translate(-50%,-50%) scale(.92)}28%{left:78%;top:20%;transform:translate(-50%,-50%) scale(.82)}45%{left:92%;top:13%;transform:translate(-50%,-50%) scale(.7)}46%{left:-8%;top:16%;transform:translate(-50%,-50%) scale(.7)}65%{left:20%;top:12%;transform:translate(-50%,-50%) scale(.84)}82%{left:38%;top:18%;transform:translate(-50%,-50%) scale(.94)}100%{left:50%;top:20%;transform:translate(-50%,-50%) scale(1)}}@keyframes balloonBob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
.cyber-card{display:none;position:fixed;z-index:18;left:18px;bottom:18px;width:clamp(190px,27vw,360px);aspect-ratio:4/3;border-radius:18px;overflow:hidden;border:2px solid #18e8ff;background:#070817;box-shadow:0 0 12px #00eaff,0 0 30px rgba(255,0,224,.72),inset 0 0 18px rgba(0,234,255,.35);pointer-events:none}.cyber-card img{width:100%;height:100%;display:block;object-fit:cover}.mode-cyberpunk .cyber-card{display:block;animation:cyberPulse 2.4s ease-in-out infinite}.mode-cyberpunk .cyber-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(0,238,255,.14),transparent 38%,rgba(255,0,211,.14));mix-blend-mode:screen}@keyframes cyberPulse{0%,100%{box-shadow:0 0 12px #00eaff,0 0 28px rgba(255,0,224,.65)}50%{box-shadow:0 0 20px #00eaff,0 0 45px rgba(255,0,224,.95)}}
.maplibregl-ctrl-top-right{top:118px}@media(max-width:620px){.sky-bg{height:32vh;min-height:180px}.top-ui{top:10px}.mode-btn{font-size:10px;padding:9px 8px}.balloon{width:105px;top:23%}.cyber-card{left:10px;bottom:28px;width:44vw;border-radius:12px}}
</style>
</head>
<body class="mode-normal">
<div id="map"></div><div id="sky-bg" class="sky-bg"></div>
<div id="cyber-card" class="cyber-card"><img id="cyber-photo" src="./assets/cyber-pool-corner.webp" alt="Cyberpunk pool" /></div>
<div class="balloon" aria-hidden="true"><svg viewBox="0 0 180 270" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="clip"><ellipse cx="90" cy="82" rx="72" ry="78"/></clipPath></defs><g stroke="#17130f" stroke-width="3" stroke-linejoin="round"><ellipse cx="90" cy="82" rx="72" ry="78" fill="#f4d21f"/><g clip-path="url(#clip)" stroke="none"><rect x="18" y="0" width="24" height="165" fill="#169b62"/><rect x="42" y="0" width="24" height="165" fill="#e53935"/><rect x="66" y="0" width="24" height="165" fill="#f4d21f"/><rect x="90" y="0" width="24" height="165" fill="#169b62"/><rect x="114" y="0" width="24" height="165" fill="#e53935"/><rect x="138" y="0" width="24" height="165" fill="#f4d21f"/></g><path d="M36 92 Q90 70 144 92 L140 119 Q90 101 40 119Z" fill="#f4d21f"/><text x="90" y="101" text-anchor="middle" font-family="Arial" font-weight="900" font-size="23" fill="#102c24" stroke="none">BOR.CZ</text><text x="90" y="114" text-anchor="middle" font-family="Arial" font-weight="700" font-size="8" fill="#102c24" stroke="none">Vždy o krok napřed</text><path d="M58 151 L68 184 M122 151 L112 184 M75 157 L79 184 M105 157 L101 184" fill="none"/><path d="M79 165 L90 178 L101 165" fill="#ff9f1c" stroke="#ffcc33"/><rect x="62" y="183" width="56" height="43" rx="7" fill="#9a5c24"/><path d="M65 192 H115 M65 202 H115 M65 212 H115" stroke="#5f3518" stroke-width="2"/><path d="M62 225 Q90 236 118 225" fill="#6d3e1c"/><g fill="#c9ad79"><path d="M53 201 q-12 13 0 28 q13-4 7-25z"/><path d="M127 201 q12 13 0 28 q-13-4-7-25z"/><path d="M69 218 q-8 12 2 23 q10-4 5-20z"/><path d="M111 218 q8 12-2 23 q-10-4-5-20z"/></g></g></svg></div>
<div class="top-ui"><div class="top-note">Projekt se připravuje · MAKO development</div><div class="mode-switch"><button class="mode-btn active" data-mode="normal">NORMAL</button><button class="mode-btn" data-mode="comic">COMIC</button><button class="mode-btn" data-mode="cyberpunk">CYBERPUNK</button></div></div>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.mjs';
fetch('./assets/sky-clouds-photo.webp.b64').then(r=>r.text()).then(t=>{document.getElementById('sky-bg').style.backgroundImage=`url(data:image/webp;base64,${t.trim()})`}).catch(()=>{document.getElementById('sky-bg').style.backgroundImage="url('./assets/sky-clouds.svg')"});
const BOR=[12.7752,49.7117];let mode='normal';
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:BOR,zoom:14.55,pitch:58,bearing:-14,antialias:true});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true,showCompass:true}),'top-right');
map.on('load',()=>{const layers=map.getStyle().layers;let firstLabel;for(const l of layers){if(l.type==='symbol'&&l.layout&&l.layout['text-field']){firstLabel=l.id;break}}map.addSource('world',{type:'vector',url:'https://tiles.openfreemap.org/planet'});map.addLayer({id:'buildings',source:'world','source-layer':'building',type:'fill-extrusion',minzoom:14,paint:{'fill-extrusion-color':['interpolate',['linear'],['zoom'],14,'#d3d0c7',17,'#c5b08b'],'fill-extrusion-height':['coalesce',['get','render_height'],8],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.84}},firstLabel)});
function apply(next){mode=next;document.body.className=`mode-${next}`;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===next));if(map.getLayer('buildings'))map.setPaintProperty('buildings','fill-extrusion-color',next==='comic'?['match',['%', ['to-number',['coalesce',['id'],1]],6],0,'#f6d16a',1,'#f59a90',2,'#a8dbed',3,'#c7e69a',4,'#f0b95c','#d3b5df']:next==='cyberpunk'?'#00d9ff':'#c9c6bd')}
document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.mode)));
</script>
</body>
</html>
