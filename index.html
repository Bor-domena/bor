<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d1714" />
<title>Bor u Tachova</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css" />
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#0d1714}#map{position:fixed;inset:0}.top-ui{position:fixed;z-index:10;top:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;width:min(92vw,650px)}.top-note{padding:9px 16px;border-radius:999px;background:rgba(8,13,12,.72);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:700;letter-spacing:.04em;backdrop-filter:blur(12px);white-space:nowrap}.mode-switch{display:grid;grid-template-columns:repeat(3,1fr);width:min(92vw,500px);padding:4px;border-radius:18px;background:rgba(4,8,9,.86);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);box-shadow:0 10px 35px rgba(0,0,0,.28)}.mode-btn{appearance:none;border:0;border-radius:14px;padding:11px 14px;color:rgba(255,255,255,.8);background:transparent;font-weight:800;font-size:12px;letter-spacing:.08em;cursor:pointer;transition:.25s}.mode-btn.active{color:#111;background:#fff}.mode-btn[data-mode="comic"].active{background:#ffd738;color:#171100;box-shadow:0 0 22px rgba(255,215,56,.38)}.mode-btn[data-mode="cyberpunk"].active{color:#fff;background:linear-gradient(135deg,#00d9ff,#d900ff 68%);box-shadow:0 0 24px rgba(217,0,255,.42)}.comic-overlay{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:.25s}.mode-comic .comic-overlay{opacity:.23;background:radial-gradient(circle,rgba(0,0,0,.26) 0 1px,transparent 1.2px) 0 0/5px 5px;mix-blend-mode:multiply}.mode-comic .maplibregl-canvas{filter:saturate(1.35) contrast(1.12) brightness(1.04)}.mode-cyberpunk .maplibregl-canvas{filter:brightness(.58) contrast(1.5) saturate(2.35) hue-rotate(168deg)}.maplibregl-ctrl-top-right{top:118px}.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{z-index:7}@media(max-width:620px){.top-ui{top:10px;gap:7px}.top-note{font-size:11px;padding:8px 12px}.mode-switch{width:min(94vw,400px)}.mode-btn{font-size:10px;padding:9px 8px}.maplibregl-ctrl-top-right{top:106px}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.179.1/build/three.module.js"}}</script>
</head>
<body class="mode-normal">
<div id="map"></div><div class="comic-overlay"></div>
<div class="top-ui"><div class="top-note">Projekt se připravuje · MAKO development</div><div class="mode-switch"><button class="mode-btn active" data-mode="normal">NORMAL</button><button class="mode-btn" data-mode="comic">COMIC</button><button class="mode-btn" data-mode="cyberpunk">CYBERPUNK</button></div></div>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.mjs';
import * as THREE from 'three';

const BOR=[12.7752,49.7117];
let mode='normal';
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:BOR,zoom:14.1,pitch:55,bearing:-12,canvasContextAttributes:{antialias:true},attributionControl:true});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true,showCompass:true}),'top-right');

const facadeColors=[0xf6d16a,0xf59a90,0xa8dbed,0xc7e69a,0xf0b95c,0xd3b5df,0xffb4a8,0xf7edd2,0xa8d7cf,0xffdfa0];
const roofColors=[0xd4431a,0xe85722,0xb93218,0xeb7219,0xc83f1d,0xe65a24];
const ink=0x17130f;
const comicScene=new THREE.Scene();
const comicCamera=new THREE.Camera();
const root=new THREE.Group();comicScene.add(root);
comicScene.add(new THREE.HemisphereLight(0xffffff,0x59623b,2.2));
const sun=new THREE.DirectionalLight(0xfff0c4,3.4);sun.position.set(-1,-1,2);comicScene.add(sun);
let comicRenderer=null, comicReady=false, rebuildTimer=null;

function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.9,metalness:0,flatShading:true});}
function edgeMaterial(){return new THREE.LineBasicMaterial({color:ink,transparent:true,opacity:.9});}
function clearRoot(){while(root.children.length){const o=root.children.pop();o.traverse?.(n=>{n.geometry?.dispose?.();if(n.material){if(Array.isArray(n.material))n.material.forEach(m=>m.dispose?.());else n.material.dispose?.();}})}}
function pseudo(seed){let x=Math.sin(seed*12.9898)*43758.5453;return x-Math.floor(x)}
function metersPerDegree(lat){return {x:111320*Math.cos(lat*Math.PI/180),y:110540};}
function centroid(ring){let x=0,y=0;for(const p of ring){x+=p[0];y+=p[1]}return [x/ring.length,y/ring.length]}
function localFootprint(ring,c){const m=metersPerDegree(c[1]);return ring.map(p=>[(p[0]-c[0])*m.x,(p[1]-c[1])*m.y]);}
function orientationAndSize(pts){let best=0,ang=0;for(let i=0;i<pts.length-1;i++){const dx=pts[i+1][0]-pts[i][0],dy=pts[i+1][1]-pts[i][1],l=Math.hypot(dx,dy);if(l>best){best=l;ang=Math.atan2(dy,dx)}}const ca=Math.cos(-ang),sa=Math.sin(-ang);let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;for(const p of pts){const x=p[0]*ca-p[1]*sa,y=p[0]*sa+p[1]*ca;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}return {w:Math.max(3,maxX-minX),d:Math.max(3,maxY-minY),ang};}
function gableGeometry(w,d,h){const hw=w/2,hd=d/2;const v=new Float32Array([-hw,-hd,0, hw,-hd,0, 0,-hd,h, -hw,hd,0, 0,hd,h, hw,hd,0, -hw,-hd,0,0,-hd,h,-hw,hd,0, -hw,hd,0,0,-hd,h,0,hd,h, hw,-hd,0,hw,hd,0,0,-hd,h, hw,hd,0,0,hd,h,0,-hd,h, 0,-hd,h,hw,-hd,0, 0,-hd,h,hw,hd,0,0,hd,h, -hw,-hd,0,0,-hd,h,0,hd,h, -hw,-hd,0,0,hd,h,-hw,hd,0]);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(v,3));g.computeVertexNormals();return g;}
function addEdges(mesh){const e=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry,28),edgeMaterial());e.position.copy(mesh.position);e.rotation.copy(mesh.rotation);e.scale.copy(mesh.scale);mesh.parent.add(e);}
function box(w,d,h,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,d,h),mat(c));return m;}
function addWindow(g,x,y,z,side='front',s=1){const f=box(1.0*s,.16,1.35*s,0x1b2a31),gl=box(.7*s,.19,1.0*s,0xa9e3ef);if(side==='front'){f.position.set(x,y,z);gl.position.set(x,y-.10,z)}else{f.position.set(x,y,z);gl.position.set(x+.10,y,z)}g.add(f,gl)}
function addDoor(g,x,y,z){const f=box(1.35,.18,2.35,0x4a2d24),p=box(1.05,.21,2.08,0x8b4b2c);f.position.set(x,y,z);p.position.set(x,y-.10,z);g.add(f,p)}
function addChimney(g,x,y,z){const c=box(.62,.62,1.9,0xf0dfc6);c.position.set(x,y,z);const cap=box(.82,.82,.16,0x3c2b23);cap.position.set(x,y,z+1.03);g.add(c,cap)}
function addDormer(g,x,y,z,roofC){const b=box(1.6,1.15,.95,0xf6e6bf);b.position.set(x,y,z);g.add(b);const r=new THREE.Mesh(gableGeometry(1.85,1.5,.65),mat(roofC));r.position.set(x,y,z+.48);g.add(r);const w=box(.7,.14,.58,0xa8e0ee);w.position.set(x,y-.66,z+.02);g.add(w)}
function buildComicHouse(feature,index){let geom=feature.geometry;if(!geom)return;let ring=geom.type==='Polygon'?geom.coordinates[0]:(geom.type==='MultiPolygon'?geom.coordinates[0][0]:null);if(!ring||ring.length<4)return;const c=centroid(ring);const pts=localFootprint(ring,c);const s=orientationAndSize(pts);if(s.w>70||s.d>70||s.w*s.d<8)return;const props=feature.properties||{};const seed=(feature.id??index)+index*13;let h=Number(props.render_height||props.height||0);if(!h){const levels=Number(props['building:levels']||props.levels||0);h=levels?levels*3.1:6.5+pseudo(seed)*7.5;}h=Math.max(4,Math.min(24,h));const floors=Math.max(1,Math.round(h/3.1));const fac=facadeColors[Math.floor(pseudo(seed+2)*facadeColors.length)];const roofC=roofColors[Math.floor(pseudo(seed+4)*roofColors.length)];const group=new THREE.Group();group.rotation.z=s.ang;const base=box(s.w,s.d,h,fac);base.position.z=h/2;group.add(base);addEdges(base);const corn=box(s.w+.22,s.d+.22,.26,0xffecc2);corn.position.z=h-.2;group.add(corn);const roofH=Math.min(4,1.8+Math.min(s.w,s.d)*.14);const roof=new THREE.Mesh(gableGeometry(s.w+.65,s.d+.7,roofH),mat(roofC));roof.position.z=h;group.add(roof);addEdges(roof);const detailed=map.getZoom()>=15.1;if(detailed){const cols=Math.max(2,Math.min(6,Math.floor(s.w/2.5)));for(let fl=0;fl<floors;fl++){const zz=1.55+fl*3.0;if(zz>h-1)return;for(let i=0;i<cols;i++){const x=-s.w/2+1.2+i*(s.w-2.4)/(cols-1||1);addWindow(group,x,-s.d/2-.08,zz,'front',.82);if(i<Math.max(2,Math.floor(s.d/3))){const y=-s.d/2+1.2+i*(s.d-2.4)/(Math.max(2,Math.floor(s.d/3))-1||1);addWindow(group,s.w/2+.08,y,zz,'side',.72)}}}addDoor(group,-s.w*.22,-s.d/2-.10,1.25);if(s.w>8&&pseudo(seed+7)>.25)addDormer(group,-s.w*.2,-s.d*.22,h+roofH*.45,roofC);if(s.w>11&&pseudo(seed+8)>.55)addDormer(group,s.w*.2,-s.d*.22,h+roofH*.45,roofC);addChimney(group,s.w*.26,pseudo(seed+5)>.5?s.d*.12:-s.d*.08,h+roofH*.62)}const mc=maplibregl.MercatorCoordinate.fromLngLat(c,0);const scale=mc.meterInMercatorCoordinateUnits();group.scale.set(scale,scale,scale);group.position.set(mc.x,mc.y,0);root.add(group)}
function rebuildComic(){if(!comicReady||mode!=='comic'||!map.isSourceLoaded('bor-world'))return;clearRoot();let feats=[];try{feats=map.querySourceFeatures('bor-world',{sourceLayer:'building'})}catch(e){return}const seen=new Set(),unique=[];for(const f of feats){let g=f.geometry;let r=g?.type==='Polygon'?g.coordinates[0]:g?.type==='MultiPolygon'?g.coordinates[0]?.[0]:null;if(!r)continue;const c=centroid(r);const key=(f.id!=null?'id'+f.id:`${c[0].toFixed(6)},${c[1].toFixed(6)}`);if(seen.has(key))continue;seen.add(key);unique.push(f)}unique.slice(0,320).forEach(buildComicHouse);map.triggerRepaint()}
function scheduleRebuild(){clearTimeout(rebuildTimer);rebuildTimer=setTimeout(rebuildComic,120)}

const comicLayer={id:'comic-3d-buildings',type:'custom',renderingMode:'3d',onAdd(m,gl){comicRenderer=new THREE.WebGLRenderer({canvas:m.getCanvas(),context:gl,antialias:true});comicRenderer.autoClear=false;comicRenderer.outputColorSpace=THREE.SRGBColorSpace;comicReady=true;scheduleRebuild()},render(gl,args){if(mode!=='comic'||!comicRenderer)return;comicCamera.projectionMatrix=new THREE.Matrix4().fromArray(args.defaultProjectionData.mainMatrix);comicRenderer.resetState();comicRenderer.render(comicScene,comicCamera);map.triggerRepaint()}};

function setLayerVisibility(id,v){if(map.getLayer(id))map.setLayoutProperty(id,'visibility',v)}
function applyMode(next){mode=next;document.body.className=`mode-${next}`;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===next));setLayerVisibility('normal-3d',next==='normal'?'visible':'none');setLayerVisibility('comic-road-outline',next==='comic'?'visible':'none');setLayerVisibility('comic-road-inner',next==='comic'?'visible':'none');setLayerVisibility('comic-water',next==='comic'?'visible':'none');setLayerVisibility('cyber-road-glow',next==='cyberpunk'?'visible':'none');setLayerVisibility('cyber-road-core',next==='cyberpunk'?'visible':'none');if(next==='comic')scheduleRebuild();map.triggerRepaint()}
document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>applyMode(b.dataset.mode)));

map.on('load',()=>{const layers=map.getStyle().layers;let firstLabel;for(const l of layers){if(l.type==='symbol'&&l.layout&&l.layout['text-field']){firstLabel=l.id;break}}map.addSource('bor-world',{type:'vector',url:'https://tiles.openfreemap.org/planet'});map.addLayer({id:'comic-water',source:'bor-world','source-layer':'water',type:'fill',minzoom:9,layout:{visibility:'none'},paint:{'fill-color':'#38bdf8','fill-opacity':.72,'fill-outline-color':'#132934'}},firstLabel);map.addLayer({id:'comic-road-outline',source:'bor-world','source-layer':'transportation',type:'line',minzoom:11,layout:{visibility:'none','line-cap':'round','line-join':'round'},paint:{'line-color':'#1b1814','line-width':['interpolate',['linear'],['zoom'],11,1.6,14,4,17,9.5],'line-opacity':.95}},firstLabel);map.addLayer({id:'comic-road-inner',source:'bor-world','source-layer':'transportation',type:'line',minzoom:11,layout:{visibility:'none','line-cap':'round','line-join':'round'},paint:{'line-color':'#f1e1b7','line-width':['interpolate',['linear'],['zoom'],11,.8,14,2.5,17,6.3],'line-opacity':.98}},firstLabel);map.addLayer({id:'cyber-road-glow',source:'bor-world','source-layer':'transportation',type:'line',minzoom:11,layout:{visibility:'none','line-cap':'round','line-join':'round'},paint:{'line-color':'#ff00c8','line-opacity':.36,'line-blur':3,'line-width':['interpolate',['linear'],['zoom'],11,2,14,6,17,14]}},firstLabel);map.addLayer({id:'cyber-road-core',source:'bor-world','source-layer':'transportation',type:'line',minzoom:11,layout:{visibility:'none','line-cap':'round','line-join':'round'},paint:{'line-color':'#21e8ff','line-opacity':.9,'line-width':['interpolate',['linear'],['zoom'],11,.5,14,1.5,17,3]}},firstLabel);map.addLayer({id:'normal-3d',source:'bor-world','source-layer':'building',type:'fill-extrusion',minzoom:14,paint:{'fill-extrusion-color':'#c8c3b8','fill-extrusion-height':['coalesce',['get','render_height'],8],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.86}},firstLabel);map.addLayer(comicLayer,firstLabel);applyMode(mode);setTimeout(()=>map.flyTo({center:BOR,zoom:14.45,pitch:58,bearing:-12,speed:.35,curve:1.2,essential:true}),350)});
map.on('moveend',scheduleRebuild);map.on('zoomend',scheduleRebuild);map.on('sourcedata',e=>{if(e.sourceId==='bor-world'&&e.isSourceLoaded)scheduleRebuild()});
</script>
</body></html>
