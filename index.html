<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d1714" />
<title>Bor u Tachova</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css" />
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#0d1714}#map{position:fixed;inset:0}.maplibregl-canvas{transition:filter .4s ease}.fx-overlay{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .4s ease}
body.mode-comic .maplibregl-canvas{filter:saturate(1.9) contrast(1.3) brightness(1.07)}
body.mode-comic .fx-overlay{opacity:.22;background:radial-gradient(circle,rgba(0,0,0,.24) 0 1px,transparent 1.2px) 0 0/5px 5px,linear-gradient(180deg,rgba(255,225,110,.05),rgba(0,0,0,.025));mix-blend-mode:multiply}
body.mode-cyberpunk{background:#05030b}body.mode-cyberpunk .maplibregl-canvas{filter:brightness(.60) contrast(1.48) saturate(2.3) hue-rotate(168deg)}body.mode-cyberpunk .fx-overlay{opacity:1;background:radial-gradient(circle at 30% 35%,rgba(0,224,255,.14),transparent 30%),radial-gradient(circle at 72% 58%,rgba(255,0,204,.18),transparent 34%),linear-gradient(180deg,rgba(8,2,24,.12),rgba(18,0,35,.30));box-shadow:inset 0 0 140px rgba(0,0,0,.65)}
.top-ui{position:fixed;z-index:8;top:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;width:min(92vw,650px)}.top-note{padding:9px 16px;border-radius:999px;background:rgba(8,13,12,.68);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:700;letter-spacing:.04em;backdrop-filter:blur(12px);white-space:nowrap}.mode-switch{display:grid;grid-template-columns:repeat(3,1fr);width:min(92vw,500px);padding:4px;border-radius:18px;background:rgba(4,8,9,.82);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);box-shadow:0 10px 35px rgba(0,0,0,.28)}.mode-btn{appearance:none;border:0;border-radius:14px;padding:11px 14px;color:rgba(255,255,255,.8);background:transparent;font-weight:800;font-size:12px;letter-spacing:.08em;cursor:pointer;transition:.25s}.mode-btn.active{color:#111;background:#fff}.mode-btn[data-mode="comic"].active{background:#ffd738;color:#171100;box-shadow:0 0 22px rgba(255,215,56,.38)}.mode-btn[data-mode="cyberpunk"].active{color:#fff;background:linear-gradient(135deg,#00d9ff,#d900ff 68%);box-shadow:0 0 24px rgba(217,0,255,.42)}.maplibregl-ctrl-top-right{top:118px}.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{z-index:7}@media(max-width:620px){.top-ui{top:10px;gap:7px}.top-note{font-size:11px;padding:8px 12px}.mode-switch{width:min(94vw,400px)}.mode-btn{font-size:10px;padding:9px 8px}.maplibregl-ctrl-top-right{top:106px}}
</style>
</head>
<body class="mode-normal">
<div id="map"></div><div class="fx-overlay"></div>
<div class="top-ui"><div class="top-note">Projekt se připravuje · MAKO development</div><div class="mode-switch"><button class="mode-btn active" data-mode="normal">NORMAL</button><button class="mode-btn" data-mode="comic">COMIC</button><button class="mode-btn" data-mode="cyberpunk">CYBERPUNK</button></div></div>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.mjs';
const BOR=[12.7752,49.7117];let currentMode='normal';
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:BOR,zoom:12.25,pitch:52,bearing:-18,canvasContextAttributes:{antialias:true},attributionControl:true});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true,showCompass:true}),'top-right');

const comicFacade=['match',['%', ['to-number',['coalesce',['id'],0]],10],0,'#ffd166',1,'#f4978e',2,'#90dbf4',3,'#b8f2a1',4,'#f6bd60',5,'#cdb4db',6,'#ffadad',7,'#f8f1d4',8,'#a8dadc',9,'#ffe29a','#f3dfb1'];
const comicRoof=['match',['%', ['to-number',['coalesce',['id'],0]],6],0,'#cf3f18',1,'#e6531f',2,'#bd3218',3,'#ee741a',4,'#a92f1a',5,'#d94b1c','#c63d19'];
const comicRoofTop=['match',['%', ['to-number',['coalesce',['id'],0]],6],0,'#f56f32',1,'#ff7f35',2,'#df542c',3,'#ff9438',4,'#ce4a2b',5,'#ef6330','#e95a2b'];
const cyberFacade=['match',['%', ['to-number',['coalesce',['id'],0]],4],0,'#00d8ff',1,'#8d3cff',2,'#ff00b8',3,'#22f0ff','#9b00ff'];
const vis=(id,v)=>{if(map.getLayer(id))map.setLayoutProperty(id,'visibility',v)};
const h=['coalesce',['get','render_height'],10];
const mul=(n)=>['*',h,n];
const add=(n)=>['+',h,n];

function applyMode(mode){
  currentMode=mode;document.body.className=`mode-${mode}`;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  const comic=mode==='comic'?'visible':'none',cyber=mode==='cyberpunk'?'visible':'none';
  ['comic-water','comic-road-outline','comic-road-inner','comic-building-outline','comic-base-trim','comic-door-band','comic-window-shadow-1','comic-window-glass-1','comic-window-shadow-2','comic-window-glass-2','comic-window-shadow-3','comic-window-glass-3','comic-cornice','comic-eaves','comic-roofs','comic-roof-highlight'].forEach(id=>vis(id,comic));
  ['cyber-road-glow','cyber-road-core'].forEach(id=>vis(id,cyber));
  if(map.getLayer('bor-3d-buildings')){
    if(mode==='comic'){
      map.setPaintProperty('bor-3d-buildings','fill-extrusion-color',comicFacade);
      map.setPaintProperty('bor-3d-buildings','fill-extrusion-opacity',.99);
    }else if(mode==='cyberpunk'){
      map.setPaintProperty('bor-3d-buildings','fill-extrusion-color',cyberFacade);
      map.setPaintProperty('bor-3d-buildings','fill-extrusion-opacity',.94);
    }else{
      map.setPaintProperty('bor-3d-buildings','fill-extrusion-color',['interpolate',['linear'],h,0,'#dedbd2',20,'#c9c4b7',60,'#aaa596']);
      map.setPaintProperty('bor-3d-buildings','fill-extrusion-opacity',.86);
    }
  }
}
document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>applyMode(b.dataset.mode)));

map.on('load',()=>{
  const layers=map.getStyle().layers;let firstLabel;
  for(const l of layers){if(l.type==='symbol'&&l.layout&&l.layout['text-field']){firstLabel=l.id;break}}
  map.addSource('bor-world',{type:'vector',url:'https://tiles.openfreemap.org/planet'});

  map.addLayer({id:'comic-water',source:'bor-world','source-layer':'water',type:'fill',minzoom:9,layout:{visibility:'none'},paint:{'fill-color':'#34bdf2','fill-opacity':.68,'fill-outline-color':'#102a3a'}},firstLabel);
  map.addLayer({id:'comic-road-outline',source:'bor-world','source-layer':'transportation',type:'line',minzoom:11,layout:{visibility:'none','line-cap':'round','line-join':'round'},paint:{'line-color':'#1e1914','line-opacity':.94,'line-width':['interpolate',['linear'],['zoom'],11,1.6,14,4.2,17,10]}},firstLabel);
  map.addLayer({id:'comic-road-inner',source:'bor-world','source-layer':'transportation',type:'line',minzoom:11,layout:{visibility:'none','line-cap':'round','line-join':'round'},paint:{'line-color':'#f0dfb4','line-opacity':.99,'line-width':['interpolate',['linear'],['zoom'],11,.8,14,2.7,17,6.7]}},firstLabel);
  map.addLayer({id:'cyber-road-glow',source:'bor-world','source-layer':'transportation',type:'line',minzoom:11,layout:{visibility:'none','line-cap':'round','line-join':'round'},paint:{'line-color':'#ff00c8','line-opacity':.35,'line-blur':3,'line-width':['interpolate',['linear'],['zoom'],11,2,14,6,17,14]}},firstLabel);
  map.addLayer({id:'cyber-road-core',source:'bor-world','source-layer':'transportation',type:'line',minzoom:11,layout:{visibility:'none','line-cap':'round','line-join':'round'},paint:{'line-color':'#21e8ff','line-opacity':.88,'line-width':['interpolate',['linear'],['zoom'],11,.5,14,1.5,17,3]}},firstLabel);
  map.addLayer({id:'comic-building-outline',source:'bor-world','source-layer':'building',type:'line',minzoom:14,layout:{visibility:'none'},paint:{'line-color':'#17130f','line-opacity':.98,'line-width':['interpolate',['linear'],['zoom'],14,.9,17,2.1]}},firstLabel);

  map.addLayer({id:'bor-3d-buildings',source:'bor-world','source-layer':'building',type:'fill-extrusion',minzoom:14,filter:['!=',['get','hide_3d'],true],paint:{'fill-extrusion-color':['interpolate',['linear'],h,0,'#dedbd2',20,'#c9c4b7',60,'#aaa596'],'fill-extrusion-height':['interpolate',['linear'],['zoom'],14,0,15,h],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.86,'fill-extrusion-vertical-gradient':true}},firstLabel);

  map.addLayer({id:'comic-base-trim',source:'bor-world','source-layer':'building',type:'fill-extrusion',minzoom:15,layout:{visibility:'none'},paint:{'fill-extrusion-color':'#4c3b2e','fill-extrusion-base':0,'fill-extrusion-height':['min',1.05,mul(.12)],'fill-extrusion-opacity':.96}},firstLabel);
  map.addLayer({id:'comic-door-band',source:'bor-world','source-layer':'building',type:'fill-extrusion',minzoom:15.2,layout:{visibility:'none'},paint:{'fill-extrusion-color':'#7a3e24','fill-extrusion-base':mul(.12),'fill-extrusion-height':mul(.21),'fill-extrusion-opacity':.9}},firstLabel);

  map.addLayer({id:'comic-window-shadow-1',source:'bor-world','source-layer':'building',type:'fill-extrusion',minzoom:15,layout:{visibility:'none'},paint:{'fill-extrusion-color':'#17242c','fill-extrusion-base':mul(.29),'fill-extrusion-height':mul(.38),'fill-extrusion-opacity':.95}},firstLabel);
  map.addLayer({id:'comic-window-glass-1',source:'bor-world','source-layer':'building',type:'fill-extrusion',minzoom:15.3,layout:{visibility:'none'},paint:{'fill-extrusion-color':'#8dd8ea','fill-extrusion-base':mul(.315),'fill-extrusion-height':mul(.355),'fill-extrusion-opacity':.98}},firstLabel);
  map.addLayer({id:'comic-window-shadow-2',source:'bor-world','source-layer':'building',type:'fill-extrusion',minzoom:15,layout:{visibility:'none'},paint:{'fill-extrusion-color':'#17242c','fill-extrusion-base':mul(.49),'fill-extrusion-height':mul(.58),'fill-extrusion-opacity':.95}},firstLabel);
  map.addLayer({id:'comic-window-glass-2',source:'bor-world','source-layer':'building',type:'fill-extrusion',minzoom:15.3,layout:{visibility:'none'},paint:{'fill-extrusion-color':'#a7e2ef','fill-extrusion-base':mul(.515),'fill-extrusion-height':mul(.555),'fill-extrusion-opacity':.98}},firstLabel);
  map.addLayer({id:'comic-window-shadow-3',source:'bor-world','source-layer':'building',type:'fill-extrusion',minzoom:15.1,layout:{visibility:'none'},paint:{'fill-extrusion-color':'#17242c','fill-extrusion-base':mul(.68),'fill-extrusion-height':mul(.77),'fill-extrusion-opacity':.95}},firstLabel);
  map.addLayer({id:'comic-window-glass-3',source:'bor-world','source-layer':'building',type:'fill-extrusion',minzoom:15.35,layout:{visibility:'none'},paint:{'fill-extrusion-color':'#b9eaf2','fill-extrusion-base':mul(.705),'fill-extrusion-height':mul(.745),'fill-extrusion-opacity':.98}},firstLabel);

  map.addLayer({id:'comic-cornice',source:'bor-world','source-layer':'building',type:'fill-extrusion',minzoom:14.8,layout:{visibility:'none'},paint:{'fill-extrusion-color':'#fff0c8','fill-extrusion-base':mul(.86),'fill-extrusion-height':mul(.90),'fill-extrusion-opacity':1}},firstLabel);
  map.addLayer({id:'comic-eaves',source:'bor-world','source-layer':'building',type:'fill-extrusion',minzoom:14,layout:{visibility:'none'},paint:{'fill-extrusion-color':'#3a2319','fill-extrusion-base':add(-.12),'fill-extrusion-height':add(.38),'fill-extrusion-opacity':1,'fill-extrusion-vertical-gradient':false}},firstLabel);
  map.addLayer({id:'comic-roofs',source:'bor-world','source-layer':'building',type:'fill-extrusion',minzoom:14,layout:{visibility:'none'},paint:{'fill-extrusion-color':comicRoof,'fill-extrusion-base':add(.38),'fill-extrusion-height':add(1.95),'fill-extrusion-opacity':1,'fill-extrusion-vertical-gradient':true}},firstLabel);
  map.addLayer({id:'comic-roof-highlight',source:'bor-world','source-layer':'building',type:'fill-extrusion',minzoom:14.4,layout:{visibility:'none'},paint:{'fill-extrusion-color':comicRoofTop,'fill-extrusion-base':add(1.65),'fill-extrusion-height':add(2.15),'fill-extrusion-opacity':1,'fill-extrusion-vertical-gradient':false}},firstLabel);

  applyMode(currentMode);
  setTimeout(()=>map.flyTo({center:BOR,zoom:13.65,pitch:55,bearing:-12,speed:.34,curve:1.25,essential:true}),450)
});

let raf=null;window.addEventListener('mousemove',e=>{if(innerWidth<800||map.isMoving())return;const nx=(e.clientX/innerWidth-.5)*2,ny=(e.clientY/innerHeight-.5)*2;if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>map.easeTo({bearing:-12+nx*4.5,pitch:55-ny*2.5,duration:650,easing:t=>t*(2-t)}))});
</script>
</body></html>
