<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d1714" />
<title>Bor u Tachova</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css" />
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#0d1714}#map{position:fixed;inset:0}.sky-bg{position:fixed;z-index:3;top:0;left:0;right:0;height:38vh;min-height:220px;pointer-events:none;background-size:cover;background-position:center 44%;opacity:.98;-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 62%,rgba(0,0,0,.88) 74%,rgba(0,0,0,.35) 90%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,#000 62%,rgba(0,0,0,.88) 74%,rgba(0,0,0,.35) 90%,transparent 100%);transition:filter .3s ease,opacity .3s ease}.mode-comic .sky-bg{filter:saturate(1.45) contrast(1.2) brightness(1.08);opacity:1}.mode-cyberpunk .sky-bg{filter:brightness(.55) contrast(1.45) saturate(1.8) hue-rotate(155deg);opacity:.88}.top-ui{position:fixed;z-index:10;top:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;width:min(92vw,650px)}.top-note{padding:9px 16px;border-radius:999px;background:rgba(8,13,12,.74);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:700;letter-spacing:.04em;backdrop-filter:blur(12px);white-space:nowrap}.mode-switch{display:grid;grid-template-columns:repeat(3,1fr);width:min(92vw,500px);padding:4px;border-radius:18px;background:rgba(4,8,9,.88);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);box-shadow:0 10px 35px rgba(0,0,0,.28)}.mode-btn{appearance:none;border:0;border-radius:14px;padding:11px 14px;color:rgba(255,255,255,.8);background:transparent;font-weight:800;font-size:12px;letter-spacing:.08em;cursor:pointer;transition:.25s}.mode-btn.active{color:#111;background:#fff}.mode-btn[data-mode="comic"].active{background:#ffd738;color:#171100;box-shadow:0 0 22px rgba(255,215,56,.38)}.mode-btn[data-mode="cyberpunk"].active{color:#fff;background:linear-gradient(135deg,#00d9ff,#d900ff 68%);box-shadow:0 0 24px rgba(217,0,255,.42)}.comic-overlay{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:.25s}.mode-comic .comic-overlay{opacity:.18;background:radial-gradient(circle,rgba(0,0,0,.25) 0 1px,transparent 1.25px) 0 0/5px 5px;mix-blend-mode:multiply}.mode-comic .maplibregl-canvas{filter:saturate(1.24) contrast(1.08) brightness(1.03)}.mode-cyberpunk .maplibregl-canvas{filter:brightness(.58) contrast(1.5) saturate(2.35) hue-rotate(168deg)}.maplibregl-ctrl-top-right{top:118px}.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{z-index:7}@media(max-width:620px){.sky-bg{height:32vh;min-height:180px}.top-ui{top:10px;gap:7px}.top-note{font-size:11px;padding:8px 12px}.mode-switch{width:min(94vw,400px)}.mode-btn{font-size:10px;padding:9px 8px}.maplibregl-ctrl-top-right{top:106px}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.179.1/build/three.module.js"}}</script>
</head>
<body class="mode-normal">
<div id="map"></div><div id="sky-bg" class="sky-bg"></div><div class="comic-overlay"></div>
<div class="top-ui"><div class="top-note">Projekt se připravuje · MAKO development</div><div class="mode-switch"><button class="mode-btn active" data-mode="normal">NORMAL</button><button class="mode-btn" data-mode="comic">COMIC</button><button class="mode-btn" data-mode="cyberpunk">CYBERPUNK</button></div></div>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.mjs';
import * as THREE from 'three';

fetch('./assets/sky-clouds-photo.webp.b64').then(r=>r.text()).then(t=>{document.getElementById('sky-bg').style.backgroundImage=`url(data:image/webp;base64,${t.trim()})`}).catch(()=>{document.getElementById('sky-bg').style.backgroundImage="url('./assets/sky-clouds.svg')"});

const BOR=[12.7752,49.7117];let mode='normal';
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:BOR,zoom:14.35,pitch:56,bearing:-13,canvasContextAttributes:{antialias:true},attributionControl:true});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true,showCompass:true}),'top-right');

const FAC=[0xf3d36b,0xf2a099,0xaadced,0xcbe79d,0xf0bd68,0xd4b7df,0xffb6aa,0xf6ead0,0xaad6cf,0xffdda1,0xf6c1d2,0xbfd9ff];
const ROOF=[0xc83818,0xe55321,0xb73018,0xe7731c,0xa92f19,0xd9481c,0xb96022];
const INK=0x17130f;
const scene=new THREE.Scene();const camera=new THREE.Camera();const root=new THREE.Group();scene.add(root);
scene.add(new THREE.HemisphereLight(0xffffff,0x62683f,2.15));const sun=new THREE.DirectionalLight(0xffefc7,3.5);sun.position.set(-1,-1,2.5);scene.add(sun);
let renderer=null,ready=false,rebuildTimer=null;
function material(c){return new THREE.MeshStandardMaterial({color:c,roughness:.88,metalness:0,flatShading:true});}
function inkMat(op=.92){return new THREE.LineBasicMaterial({color:INK,transparent:true,opacity:op});}
function disposeRoot(){while(root.children.length){const o=root.children.pop();o.traverse(n=>{n.geometry?.dispose?.();if(n.material){if(Array.isArray(n.material))n.material.forEach(m=>m.dispose?.());else n.material.dispose?.();}})}}
function rnd(seed){const x=Math.sin(seed*12.9898+78.233)*43758.5453;return x-Math.floor(x)}
function centroid(r){let x=0,y=0;for(const p of r){x+=p[0];y+=p[1]}return[x/r.length,y/r.length]}
function meterPts(r,c){const mx=111320*Math.cos(c[1]*Math.PI/180),my=110540;return r.map(p=>[(p[0]-c[0])*mx,(p[1]-c[1])*my]);}
function boxInfo(pts){let best=0,a=0;for(let i=0;i<pts.length-1;i++){const dx=pts[i+1][0]-pts[i][0],dy=pts[i+1][1]-pts[i][1],l=Math.hypot(dx,dy);if(l>best){best=l;a=Math.atan2(dy,dx)}}const ca=Math.cos(-a),sa=Math.sin(-a);let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;for(const p of pts){const x=p[0]*ca-p[1]*sa,y=p[0]*sa+p[1]*ca;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}return{w:Math.max(3,maxX-minX),d:Math.max(3,maxY-minY),a};}
function meshBox(w,d,h,c){return new THREE.Mesh(new THREE.BoxGeometry(w,d,h),material(c));}
function addEdges(g,m,op=.92){const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,25),inkMat(op));e.position.copy(m.position);e.rotation.copy(m.rotation);e.scale.copy(m.scale);g.add(e)}
function gable(w,d,h){const hw=w/2,hd=d/2;const v=new Float32Array([-hw,-hd,0,hw,-hd,0,0,-hd,h,-hw,hd,0,0,hd,h,hw,hd,0,-hw,-hd,0,0,-hd,h,-hw,hd,0,-hw,hd,0,0,-hd,h,0,hd,h,hw,-hd,0,hw,hd,0,0,-hd,h,hw,hd,0,0,hd,h,0,-hd,h,0,-hd,h,hw,-hd,0,0,-hd,h,hw,hd,0,0,hd,h,-hw,-hd,0,0,-hd,h,0,hd,h,-hw,-hd,0,0,hd,h,-hw,hd,0]);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(v,3));g.computeVertexNormals();return g;}
function addWindow(g,x,y,z,side='front',s=1){const frame=meshBox(1.08*s,.17,1.48*s,0x17252c),glass=meshBox(.74*s,.205,1.10*s,0x9bddec);if(side==='front'){frame.position.set(x,y,z);glass.position.set(x,y-.11,z)}else{frame.position.set(x,y,z);glass.position.set(x+.11,y,z)}g.add(frame,glass);const barV=meshBox(.09*s,.22,1.08*s,0xf7e4b9),barH=meshBox(.72*s,.22,.09*s,0xf7e4b9);if(side==='front'){barV.position.set(x,y-.13,z);barH.position.set(x,y-.13,z)}else{barV.rotation.z=Math.PI/2;barH.rotation.z=Math.PI/2;barV.position.set(x+.13,y,z);barH.position.set(x+.13,y,z)}g.add(barV,barH)}
function addDoor(g,x,y,z){const f=meshBox(1.45,.19,2.55,0x3b2721),p=meshBox(1.13,.22,2.28,0x8f4a2c);f.position.set(x,y,z);p.position.set(x,y-.12,z);g.add(f,p);const aw=meshBox(1.9,.72,.18,0x533429);aw.position.set(x,y-.26,z+1.48);g.add(aw)}
function addChimney(g,x,y,z){const c=meshBox(.68,.68,2.0,0xead8b7);c.position.set(x,y,z);g.add(c);const cap=meshBox(.9,.9,.18,0x392921);cap.position.set(x,y,z+1.08);g.add(cap);addEdges(g,c,.8)}
function addDormer(g,x,y,z,rc){const b=meshBox(1.75,1.25,1.05,0xf3dfb8);b.position.set(x,y,z);g.add(b);const r=new THREE.Mesh(gable(2.05,1.62,.72),material(rc));r.position.set(x,y,z+.53);g.add(r);addEdges(g,r,.8);const w=meshBox(.82,.15,.68,0x9eddec);w.position.set(x,y-.72,z+.02);g.add(w)}
function roofTiles(g,w,d,z){const lines=5;for(let i=1;i<lines;i++){const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-w/2+.2,-d/2+(d/lines)*i,z),new THREE.Vector3(w/2-.2,-d/2+(d/lines)*i,z)]),new THREE.LineBasicMaterial({color:0x7d2618,transparent:true,opacity:.45}));g.add(ln)}}
function house(feature,index){const geom=feature.geometry;let ring=geom?.type==='Polygon'?geom.coordinates[0]:geom?.type==='MultiPolygon'?geom.coordinates[0]?.[0]:null;if(!ring||ring.length<4)return;const c=centroid(ring),bi=boxInfo(meterPts(ring,c));if(bi.w>65||bi.d>65||bi.w*bi.d<9)return;const pr=feature.properties||{},seed=(feature.id??index)+index*17;let h=Number(pr.render_height||pr.height||0);if(!h){const lv=Number(pr['building:levels']||pr.levels||0);h=lv?lv*3.05:6+rnd(seed)*8}h=Math.max(4.8,Math.min(22,h));const floors=Math.max(1,Math.round(h/3.05)),fac=FAC[Math.floor(rnd(seed+2)*FAC.length)],rc=ROOF[Math.floor(rnd(seed+4)*ROOF.length)];const g=new THREE.Group();g.rotation.z=-bi.a;const base=meshBox(bi.w,bi.d,h,fac);base.position.z=h/2;g.add(base);addEdges(g,base);const plinth=meshBox(bi.w+.05,bi.d+.05,.42,0x655044);plinth.position.z=.21;g.add(plinth);const corn=meshBox(bi.w+.3,bi.d+.3,.3,0xffedc7);corn.position.z=h-.2;g.add(corn);const roofH=Math.min(4.5,1.8+Math.min(bi.w,bi.d)*.16);const roof=new THREE.Mesh(gable(bi.w+.82,bi.d+.9,roofH),material(rc));roof.position.z=h;g.add(roof);addEdges(g,roof,1);roofTiles(g,bi.w+.6,bi.d+.6,h+roofH*.72);
const detailed=map.getZoom()>=15; if(detailed){const cols=Math.max(2,Math.min(7,Math.floor(bi.w/2.5)));for(let fl=0;fl<floors;fl++){const zz=1.55+fl*3.0;if(zz>h-1.0)break;for(let i=0;i<cols;i++){const x=-bi.w/2+1.25+i*(bi.w-2.5)/(cols-1||1);addWindow(g,x,-bi.d/2-.09,zz,'front',.8)}const sideCols=Math.max(2,Math.min(5,Math.floor(bi.d/2.7)));for(let i=0;i<sideCols;i++){const y=-bi.d/2+1.25+i*(bi.d-2.5)/(sideCols-1||1);addWindow(g,bi.w/2+.09,y,zz,'side',.72)}}addDoor(g,-bi.w*.22,-bi.d/2-.11,1.28);if(bi.w>8&&rnd(seed+7)>.18)addDormer(g,-bi.w*.2,-bi.d*.24,h+roofH*.43,rc);if(bi.w>12&&rnd(seed+8)>.48)addDormer(g,bi.w*.2,-bi.d*.24,h+roofH*.43,rc);addChimney(g,bi.w*.25,rnd(seed+5)>.5?bi.d*.12:-bi.d*.08,h+roofH*.65)}
const mc=maplibregl.MercatorCoordinate.fromLngLat(c,0),sc=mc.meterInMercatorCoordinateUnits();g.scale.set(sc,sc,sc);g.position.set(mc.x,mc.y,0);root.add(g)}
function rebuild(){if(!ready||mode!=='comic'||!map.isSourceLoaded('bor-world'))return;disposeRoot();let fs=[];try{fs=map.querySourceFeatures('bor-world',{sourceLayer:'building'})}catch{return}const seen=new Set(),u=[];for(const f of fs){const r=f.geometry?.type==='Polygon'?f.geometry.coordinates[0]:f.geometry?.type==='MultiPolygon'?f.geometry.coordinates[0]?.[0]:null;if(!r)continue;const c=centroid(r),k=f.id!=null?'i'+f.id:`${c[0].toFixed(6)},${c[1].toFixed(6)}`;if(seen.has(k))continue;seen.add(k);u.push(f)}u.slice(0,map.getZoom()>=15?420:260).forEach(house);map.triggerRepaint()}
function schedule(){clearTimeout(rebuildTimer);rebuildTimer=setTimeout(rebuild,150)}
const comicLayer={id:'comic-3d-houses',type:'custom',renderingMode:'3d',onAdd(m,gl){renderer=new THREE.WebGLRenderer({canvas:m.getCanvas(),context:gl,antialias:true});renderer.autoClear=false;renderer.outputColorSpace=THREE.SRGBColorSpace;ready=true;schedule()},render(gl,arg){if(mode!=='comic'||!renderer)return;const mx=(arg&&arg.defaultProjectionData?.mainMatrix)||arg?.mainMatrix||arg;if(!mx)return;camera.projectionMatrix=new THREE.Matrix4().fromArray(mx);renderer.resetState();renderer.render(scene,camera);map.triggerRepaint()}};
function vis(id,v){if(map.getLayer(id))map.setLayoutProperty(id,'visibility',v)}
function apply(next){mode=next;document.body.className=`mode-${next}`;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===next));vis('normal-3d',next==='normal'?'visible':'none');vis('comic-water',next==='comic'?'visible':'none');vis('comic-road-outline',next==='comic'?'visible':'none');vis('comic-road-inner',next==='comic'?'visible':'none');vis('cyber-road-glow',next==='cyberpunk'?'visible':'none');vis('cyber-road-core',next==='cyberpunk'?'visible':'none');if(next==='comic')schedule();map.triggerRepaint()}
document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.mode)));
map.on('load',()=>{const ls=map.getStyle().layers;let firstLabel;for(const l of ls){if(l.type==='symbol'&&l.layout&&l.layout['text-field']){firstLabel=l.id;break}}map.addSource('bor-world',{type:'vector',url:'https://tiles.openfreemap.org/planet'});map.addLayer({id:'comic-water',source:'bor-world','source-layer':'water',type:'fill',layout:{visibility:'none'},paint:{'fill-color':'#31bdf2','fill-opacity':.73,'fill-outline-color':'#142936'}},firstLabel);map.addLayer({id:'comic-road-outline',source:'bor-world','source-layer':'transportation',type:'line',minzoom:11,layout:{visibility:'none','line-cap':'round','line-join':'round'},paint:{'line-color':'#171512','line-width':['interpolate',['linear'],['zoom'],11,1.4,14,4.5,17,11]}},firstLabel);map.addLayer({id:'comic-road-inner',source:'bor-world','source-layer':'transportation',type:'line',minzoom:11,layout:{visibility:'none','line-cap':'round','line-join':'round'},paint:{'line-color':'#efe1b9','line-width':['interpolate',['linear'],['zoom'],11,.8,14,2.8,17,7.2]}},firstLabel);map.addLayer({id:'cyber-road-glow',source:'bor-world','source-layer':'transportation',type:'line',layout:{visibility:'none'},paint:{'line-color':'#ff00d0','line-blur':3,'line-opacity':.45,'line-width':['interpolate',['linear'],['zoom'],11,2,15,8,17,16]}},firstLabel);map.addLayer({id:'cyber-road-core',source:'bor-world','source-layer':'transportation',type:'line',layout:{visibility:'none'},paint:{'line-color':'#25e9ff','line-width':['interpolate',['linear'],['zoom'],11,.5,15,2,17,4]}},firstLabel);map.addLayer({id:'normal-3d',source:'bor-world','source-layer':'building',type:'fill-extrusion',minzoom:14,paint:{'fill-extrusion-color':'#c9c6bd','fill-extrusion-height':['coalesce',['get','render_height'],8],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.82}},firstLabel);map.addLayer(comicLayer,firstLabel);apply('normal');setTimeout(()=>map.flyTo({center:BOR,zoom:14.8,pitch:58,bearing:-14,speed:.35,curve:1.2,essential:true}),400)});
map.on('moveend',()=>{if(mode==='comic')schedule()});map.on('zoomend',()=>{if(mode==='comic')schedule()});
</script>
